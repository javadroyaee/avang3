name: Build Avang VPN APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile hev-socks5-tunnel Native Libraries via NDK
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev
          NDK_BIN=$(find "$ANDROID_HOME/ndk" -maxdepth 2 -name "ndk-build" | head -n 1)
          echo "Using NDK: $NDK_BIN"
          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/jni"
          echo 'include $(call all-subdir-makefiles)' > "$TMPDIR/jni/Android.mk"
          ln -s /tmp/hev "$TMPDIR/jni/hev-socks5-tunnel"
          "$NDK_BIN" \
            NDK_PROJECT_PATH="$TMPDIR" \
            APP_BUILD_SCRIPT="$TMPDIR/jni/Android.mk" \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM=android-24 \
            NDK_LIBS_OUT="$TMPDIR/libs" \
            NDK_OUT="$TMPDIR/obj"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp "$TMPDIR/libs/arm64-v8a/libhev-socks5-tunnel.so" app/src/main/jniLibs/arm64-v8a/
          cp "$TMPDIR/libs/armeabi-v7a/libhev-socks5-tunnel.so" app/src/main/jniLibs/armeabi-v7a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build Signed Release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Debug Fallback
        if: env.HAS_KEYSTORE == 'false'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug
        if: env.HAS_KEYSTORE == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
